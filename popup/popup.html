<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoSlop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="icon brand-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
        <div class="brand-text">
          <span class="brand-name">NoSlop 2.5</span>
          <span class="status-indicator" id="statusBadge">Active</span>
        </div>
      </div>
      <label class="switch" title="Toggle NoSlop on/off">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Metrics Card -->
    <section class="metrics-card">
      <div class="metric-item">
        <span class="metric-label">Current tab</span>
        <span class="metric-value tabular" id="tabCount">0</span>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <span class="metric-label">All-time blocked</span>
        <span class="metric-value tabular" id="totalCount">0</span>
      </div>
    </section>

    <!-- Detection Engines -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Detection engines</h2>
        <span class="badge-recommended">Smart Filter</span>
      </div>

      <div class="rule-list">
        <!-- Engine 1: Multi-Signal Heuristic (Best One / Default) -->
        <div class="engine-box">
          <label class="rule-item no-border">
            <div class="rule-text">
              <span class="rule-label">1. Multi-signal heuristic scoring <span class="tag-default">Primary</span></span>
              <span class="rule-desc">Bayesian probability across formulas, disclaimers, and generative models</span>
            </div>
            <input type="checkbox" id="toggleEngineScoring" class="sub-toggle" checked>
          </label>
          <div class="sensitivity-row">
            <span class="sensitivity-label">Sensitivity</span>
            <div class="segmented-control">
              <button type="button" class="segment-btn" data-val="conservative">Low</button>
              <button type="button" class="segment-btn active" data-val="balanced">Balanced</button>
              <button type="button" class="segment-btn" data-val="aggressive">High</button>
            </div>
          </div>
        </div>

        <!-- Engine 3: Community Consensus -->
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">2. Community & curated blocklist</span>
            <span class="rule-desc">Instant O(1) hash set matching known AI drama mills and platforms</span>
          </div>
          <input type="checkbox" id="toggleEngineCommunity" class="sub-toggle" checked>
        </label>

        <!-- Engine 4: Watch Page Audio & Script -->
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">3. Audio cadence & script perplexity</span>
            <span class="rule-desc">Identifies robotic TTS pause rhythms and LLM script n-grams</span>
          </div>
          <input type="checkbox" id="toggleEngineAudioScript" class="sub-toggle" checked>
        </label>

        <!-- Engine 2: Thumbnail Vision (Optional) -->
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">4. Thumbnail vision scan <span class="tag-optional">Optional</span></span>
            <span class="rule-desc">Canvas pixel analysis for plastic skin (off by default to protect human creators)</span>
          </div>
          <input type="checkbox" id="toggleEngineThumbnails" class="sub-toggle">
        </label>
      </div>
    </section>

    <!-- Community Blocklist Sync -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Community blocklist</h2>
        <span class="badge-recommended" id="communityCountBadge">36 Channels</span>
      </div>
      <div class="community-sync-box">
        <div class="community-sync-info">
          <span class="community-sync-status" id="syncStatus">Connected to GitHub</span>
          <span class="community-sync-time" id="lastSyncTime">Syncs automatically</span>
        </div>
        <div class="community-sync-actions">
          <button type="button" id="syncNowBtn" class="btn btn-secondary btn-sm">Sync now</button>
          <button type="button" id="exportReportsBtn" class="btn btn-secondary btn-sm" title="Export queued channel reports as JSON">Export queue</button>
        </div>
      </div>
    </section>

    <!-- Creator Safety & Preferences -->
    <section class="section">
      <h2 class="section-title">Creator safety & preferences</h2>
      <div class="rule-list">
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">Protect verified human creators</span>
            <span class="rule-desc">Never block verified channels (StarTalk, DOAC, etc.) talking about AI</span>
          </div>
          <input type="checkbox" id="toggleWhitelistVerified" class="sub-toggle" checked>
        </label>

        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">YouTube official AI info buttons</span>
            <span class="rule-desc">Instant block when YouTube marks "How this content was made"</span>
          </div>
          <input type="checkbox" id="toggleSynthetic" class="sub-toggle" checked>
        </label>

        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">AI Shorts</span>
            <span class="rule-desc">Filter synthetic media and automated loops in Shorts feeds</span>
          </div>
          <input type="checkbox" id="toggleShorts" class="sub-toggle">
        </label>

        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">Placeholder mode</span>
            <span class="rule-desc">Show subtle collapsed bar instead of hiding completely</span>
          </div>
          <input type="checkbox" id="togglePlaceholder" class="sub-toggle">
        </label>
      </div>
    </section>

    <!-- Lists Management (Keywords & Channels) -->
    <section class="section">
      <div class="tabs-nav">
        <button type="button" class="tab-btn active" data-tab="keywordsTab">Keywords</button>
        <button type="button" class="tab-btn" data-tab="channelsTab">Blocked channels</button>
      </div>

      <!-- Keywords Tab Pane -->
      <div class="tab-pane active" id="keywordsTab">
        <div class="input-row">
          <input type="text" id="newKeywordInput" placeholder="Add keyword (e.g. #flux, suno)..." maxlength="40">
          <button type="button" id="addKeywordBtn" class="btn btn-secondary">Add</button>
        </div>
        <div class="tag-cloud" id="keywordCloud"></div>
      </div>

      <!-- Channels Tab Pane -->
      <div class="tab-pane" id="channelsTab">
        <div class="input-row">
          <input type="text" id="newChannelInput" placeholder="Add channel name or @handle..." maxlength="60">
          <button type="button" id="addChannelBtn" class="btn btn-secondary">Add</button>
        </div>
        <div class="channel-list" id="channelList"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button type="button" id="resetDefaultsBtn" class="btn-link">Reset all engines to default</button>
      <span class="footer-note">Updates instantly</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
