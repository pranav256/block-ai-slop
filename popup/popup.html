<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoSlop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="icon brand-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
        <div class="brand-text">
          <span class="brand-name">NoSlop 5.0</span>
          <span class="status-indicator" id="statusBadge">Active</span>
        </div>
      </div>
      <label class="switch" title="Toggle NoSlop on/off">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Metrics Card -->
    <section class="metrics-card">
      <div class="metric-item">
        <span class="metric-label">Current tab</span>
        <span class="metric-value tabular" id="tabCount">0</span>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <span class="metric-label">All-time blocked</span>
        <span class="metric-value tabular" id="totalCount">0</span>
      </div>
    </section>

    <!-- Detection Engines -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Detection engines</h2>
        <span class="badge-recommended">Smart Filter</span>
      </div>

      <div class="rule-list">
        <!-- Engine 1: Multi-Signal Heuristic (Best One / Default) -->
        <div class="engine-box">
          <label class="rule-item no-border">
            <div class="rule-text">
              <span class="rule-label">1. Multi-signal heuristic scoring <span class="tag-default">Primary</span></span>
              <span class="rule-desc">Bayesian probability across formulas, disclaimers, and generative models</span>
            </div>
            <input type="checkbox" id="toggleEngineScoring" class="sub-toggle" checked>
          </label>
          <div class="sensitivity-row">
            <span class="sensitivity-label">Sensitivity</span>
            <div class="segmented-control">
              <button type="button" class="segment-btn" data-val="conservative">Low</button>
              <button type="button" class="segment-btn active" data-val="balanced">Balanced</button>
              <button type="button" class="segment-btn" data-val="aggressive">High</button>
            </div>
          </div>
        </div>

        <!-- Model training data -->
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">2. Community training data</span>
            <span class="rule-desc">Improves the statistical model without directly blocking by channel or name</span>
          </div>
          <input type="checkbox" id="toggleEngineCommunity" class="sub-toggle" checked>
        </label>

        <!-- Engine 4: Script pattern analysis -->
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">3. Script pattern analysis</span>
            <span class="rule-desc">Identifies repetitive structure and low-diversity generated scripts</span>
          </div>
          <input type="checkbox" id="toggleEngineAudioScript" class="sub-toggle" checked>
        </label>

        <!-- Engine 2: Thumbnail Vision (Optional) -->
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">4. Thumbnail vision scan <span class="tag-optional">Optional</span></span>
            <span class="rule-desc">Canvas pixel analysis for plastic skin (off by default to protect human creators)</span>
          </div>
          <input type="checkbox" id="toggleEngineThumbnails" class="sub-toggle">
        </label>
      </div>
    </section>

    <!-- Model Training Data Sync -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Model training data</h2>
        <span class="badge-recommended" id="communityCountBadge">0 Examples</span>
      </div>
      <div class="community-sync-box">
        <div class="community-sync-info">
          <span class="community-sync-status" id="syncStatus">Connected to GitHub</span>
          <span class="community-sync-time" id="lastSyncTime">Syncs automatically</span>
        </div>
        <div class="community-sync-actions">
          <button type="button" id="syncNowBtn" class="btn btn-secondary btn-sm">Sync training data</button>
          <button type="button" id="exportReportsBtn" class="btn btn-secondary btn-sm" title="Download queued reports as a JSON file">Export JSON</button>
        </div>
      </div>
    </section>

    <!-- Preferences -->
    <section class="section">
      <h2 class="section-title">Preferences</h2>
      <div class="rule-list">
        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">AI Shorts</span>
            <span class="rule-desc">Filter synthetic media and automated loops in Shorts feeds</span>
          </div>
          <input type="checkbox" id="toggleShorts" class="sub-toggle">
        </label>

        <label class="rule-item">
          <div class="rule-text">
            <span class="rule-label">Placeholder mode</span>
            <span class="rule-desc">Show subtle collapsed bar instead of hiding completely</span>
          </div>
          <input type="checkbox" id="togglePlaceholder" class="sub-toggle">
        </label>
      </div>
    </section>

    <!-- User Overrides -->
    <section class="section">
      <h2 class="section-title">User overrides</h2>
      <div class="rule-list">
        <div class="input-row">
          <input type="text" id="newChannelInput" placeholder="Add channel name or @handle..." maxlength="60">
          <button type="button" id="addChannelBtn" class="btn btn-secondary">Add</button>
        </div>
        <div class="channel-list" id="channelList"></div>
        <div class="list-subsection">
          <div class="list-subsection-header">
            <span class="rule-label">Always allow</span>
            <span class="rule-desc">Overrides the statistical decision for this channel</span>
          </div>
          <div class="input-row">
            <input type="text" id="newAllowedChannelInput" placeholder="Allow channel or @handle..." maxlength="60">
            <button type="button" id="addAllowedChannelBtn" class="btn btn-secondary">Add</button>
          </div>
          <div class="channel-list" id="allowedChannelList"></div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button type="button" id="resetDefaultsBtn" class="btn-link">Reset all engines to default</button>
      <span class="footer-note">Updates instantly</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
